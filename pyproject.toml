[project]
name = "gaia-multi-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.13,<5",
  "datasets>=4,<5",
  "huggingface-hub>=0.34,<2",
  "httpx>=0.28,<1",
  "langfuse>=4,<5",
  "langgraph>=1,<2",
  "mcp>=2,<3",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
gaia-agent = "gaia_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
